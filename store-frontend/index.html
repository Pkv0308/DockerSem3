<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management - Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Store Login</h3>
        
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent page reload
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            
            // Your Java LoginServlet expects URL Encoded form data
            const formData = new URLSearchParams();
            formData.append('username', user);
            formData.append('password', pass);

            try {
                // UPDATE THIS URL WITH YOUR TOMCAT PROJECT NAME
                const response = await fetch('http://localhost:8080/inventory-service-1.0-SNAPSHOT/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    credentials: 'include',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    // Save session data to localStorage
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('role', data.role);
                    
                    // Redirect to the main app
                    window.location.href = 'dashboard.html';
                } else {
                    errorAlert.textContent = "Invalid username or password.";
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                errorAlert.textContent = "Cannot connect to the server.";
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
